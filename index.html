<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #2b2b2b;
    overflow: hidden;
    height: 100%;
    width: 100%;
    touch-action: none;
    overscroll-behavior: none;
  }
  canvas {
    display: block;
    margin: 0 auto;
    background: #4a7c3c;
    image-rendering: pixelated;
    touch-action: none;
  }
  #info {
    position: fixed;
    top: 10px;
    left: 10px;
    color: #eee;
    font-family: monospace;
    font-size: 12px;
    background: rgba(0,0,0,0.4);
    padding: 6px 10px;
    border-radius: 6px;
    max-width: 260px;
    z-index: 20;
  }
  #nameDisplay {
    margin-top: 6px;
    font-weight: bold;
    color: #ffd27f;
  }
  #infoButtons {
    display: flex;
    gap: 6px;
    margin-top: 6px;
  }
  .infoBtn {
    font-family: monospace;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.12);
    color: #eee;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .infoBtn:active { background: rgba(255,255,255,0.3); }

  #nameOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 50;
    align-items: center;
    justify-content: center;
  }
  #nameOverlay.open { display: flex; }
  #nameBox {
    background: rgba(20,20,20,0.95);
    border: 2px solid #7fffb0;
    border-radius: 10px;
    padding: 20px 24px;
    font-family: monospace;
    color: #eee;
    text-align: center;
    width: min(90vw, 320px);
  }
  #nameTitle {
    font-weight: bold;
    margin-bottom: 12px;
  }
  #nameInput {
    width: 100%;
    box-sizing: border-box;
    font-family: monospace;
    font-size: 15px;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.4);
    background: rgba(0,0,0,0.4);
    color: #fff;
    margin-bottom: 12px;
  }
  #nameSubmitBtn {
    font-family: monospace;
    font-weight: bold;
    font-size: 14px;
    padding: 8px 16px;
    border-radius: 8px;
    border: 2px solid #7fffb0;
    background: rgba(127,255,176,0.15);
    color: #7fffb0;
    cursor: pointer;
  }
  #nameSubmitBtn:active { background: rgba(127,255,176,0.35); }

  #tierOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 50;
    align-items: center;
    justify-content: center;
  }
  #tierOverlay.open { display: flex; }
  #tierBox {
    background: rgba(20,20,20,0.95);
    border: 2px solid #7fffb0;
    border-radius: 10px;
    padding: 20px 24px;
    font-family: monospace;
    color: #eee;
    text-align: center;
    width: min(90vw, 340px);
  }
  #tierTitle {
    font-weight: bold;
    margin-bottom: 4px;
  }
  #tierSubtitle {
    font-size: 12px;
    color: #aaa;
    margin-bottom: 14px;
  }
  .tierBtn {
    display: block;
    width: 100%;
    box-sizing: border-box;
    font-family: monospace;
    font-weight: bold;
    font-size: 14px;
    padding: 10px 14px;
    border-radius: 8px;
    border: 2px solid #7fffb0;
    background: rgba(127,255,176,0.15);
    color: #7fffb0;
    cursor: pointer;
    margin-bottom: 10px;
    text-align: left;
  }
  .tierBtn:last-child { margin-bottom: 0; }
  .tierBtn:active { background: rgba(127,255,176,0.35); }
  .tierBtn small { display: block; font-weight: normal; color: #bbb; font-size: 11px; margin-top: 2px; }

  #gunControls {
    position: fixed;
    bottom: 130px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 10;
  }
  #gunControls button, .touchBtn {
    font-family: monospace;
    font-weight: bold;
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.4);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #shootBtn {
    background: #b33a3a;
    color: #fff;
  }
  #shootBtn:active {
    background: #8f2e2e;
  }
  #reloadBtn {
    background: #3a5fb3;
    color: #fff;
  }
  #reloadBtn:active {
    background: #2e4a8f;
  }

  /* touch-only controls: virtual d-pad and action buttons */
  #dpad {
    position: fixed;
    left: 16px;
    bottom: 16px;
    width: 150px;
    height: 150px;
    z-index: 10;
  }
  #dpad button {
    position: absolute;
    width: 50px;
    height: 50px;
    font-size: 18px;
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.18);
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #dpad button:active { background: rgba(255,255,255,0.4); }
  #dpadUp    { left: 50px; top: 0; }
  #dpadDown  { left: 50px; top: 100px; }
  #dpadLeft  { left: 0; top: 50px; }
  #dpadRight { left: 100px; top: 50px; }
  #dpadRun   { left: 50px; top: 50px; font-size: 10px; background: rgba(255,210,127,0.3); }
  #dpadRun.active { background: #ffd27f; color: #1a1a1a; border-color: #fff; }

  #actionButtons {
    position: fixed;
    right: 16px;
    bottom: 16px;
    display: flex;
    gap: 8px;
    z-index: 10;
  }
  .touchBtn {
    background: rgba(20,20,20,0.55);
    color: #fff;
    width: 54px;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0;
  }
  .touchBtn:active { background: rgba(255,210,127,0.35); }

  #dialogueOptions {
    position: fixed;
    left: 50%;
    bottom: 120px;
    transform: translateX(-50%);
    display: none;
    flex-direction: column;
    gap: 6px;
    z-index: 30;
    width: min(90vw, 720px);
  }
  #dialogueOptions button {
    font-family: monospace;
    font-size: 14px;
    padding: 10px 14px;
    border-radius: 8px;
    border: 2px solid #7fffb0;
    background: rgba(10,10,10,0.92);
    color: #7fffb0;
    text-align: left;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #dialogueOptions button:active { background: rgba(127,255,176,0.25); }

  /* hide touch controls on devices that clearly have a mouse/keyboard,
     show them whenever a touch capability is present */
  body:not(.touch) #dpad,
  body:not(.touch) #actionButtons,
  body:not(.touch) #wheelieBtn {
    opacity: 0.35;
  }

  /* movement is frozen during a conversation anyway - hide the pad/buttons
     so they don't collide with the dialogue box and its option buttons */
  body.dialogue-open #dpad,
  body.dialogue-open #actionButtons,
  body.dialogue-open #gunControls,
  body.dialogue-open #wheelieBtn {
    display: none;
  }

  /* aligned directly above TALK (the first/leftmost button in the action
     row) using the same right-edge math as that row, so it stays clear of
     everything else regardless of screen width - a fixed left: position
     worked in landscape but landed right on top of the action buttons on
     a narrower portrait phone screen */
  #wheelieBtn {
    position: fixed;
    right: 264px;
    bottom: 82px;
    z-index: 10;
  }

  /* the d-pad and the action-button row are wide enough that they overlap
     on every common phone width in portrait (the d-pad's right edge sits
     past where the action row's left edge lands) - shrink both so they
     actually fit side by side instead of stacking on top of each other */
  @media (max-width: 480px) {
    #dpad { width: 110px; height: 110px; }
    #dpad button { width: 38px; height: 38px; font-size: 14px; }
    #dpadUp    { left: 36px; top: 0; }
    #dpadDown  { left: 36px; top: 72px; }
    #dpadLeft  { left: 0; top: 36px; }
    #dpadRight { left: 72px; top: 36px; }
    #dpadRun   { left: 36px; top: 36px; font-size: 8px; }

    #actionButtons { gap: 6px; }
    .touchBtn { width: 40px; height: 40px; font-size: 9px; line-height: 1.15; }

    #wheelieBtn { right: 200px; bottom: 64px; }
  }
</style>
</head>
<body>
<div id="info">
  <span id="infoText">Move with WASD/arrows or the pad, hold Shift or tap RUN to run. Tap TALK to interact. G to draw your gun, M to ride whatever's nearby (bike/car/paddleboard/surfboard), N for the map, X to wheelie/jump.</span>
  <div id="trackEditorInfo" style="display:none; margin-top:6px; color:#ffd27f;"></div>
  <div id="furnitureEditorInfo" style="display:none; margin-top:6px; color:#ffd27f;"></div>
  <div id="nameDisplay"></div>
  <div id="infoButtons">
    <button class="infoBtn" id="newGameBtn">New Game</button>
    <button class="infoBtn" id="renameBtn">Rename</button>
    <button class="infoBtn" id="muteBtn">🔊</button>
  </div>
</div>

<div id="nameOverlay">
  <div id="nameBox">
    <div id="nameTitle">What's your name?</div>
    <input id="nameInput" type="text" maxlength="20" placeholder="Enter a name" autocomplete="off" />
    <button id="nameSubmitBtn">Start</button>
  </div>
</div>

<div id="tierOverlay">
  <div id="tierBox">
    <div id="tierTitle">How are you starting out?</div>
    <div id="tierSubtitle">This sets your starting cash.</div>
    <button class="tierBtn" data-tier="broke">Broke - $500<small>Every dollar counts.</small></button>
    <button class="tierBtn" data-tier="comfortable">Comfortable - $5,000<small>A decent cushion.</small></button>
    <button class="tierBtn" data-tier="loaded">Loaded<small>Money's never the problem.</small></button>
  </div>
</div>

<canvas id="game" width="800" height="600"></canvas>
<div id="gunControls">
  <button id="reloadBtn">RELOAD (R)</button>
  <button id="shootBtn">SHOOT (Space)</button>
</div>

<div id="dpad">
  <button id="dpadUp">▲</button>
  <button id="dpadDown">▼</button>
  <button id="dpadLeft">◀</button>
  <button id="dpadRight">▶</button>
  <button id="dpadRun">RUN</button>
</div>

<button class="touchBtn" id="wheelieBtn">WHEELIE<br>(X)</button>

<div id="actionButtons">
  <button class="touchBtn" id="talkBtn">TALK<br>(E)</button>
  <button class="touchBtn" id="gunBtn">GUN<br>(G)</button>
  <button class="touchBtn" id="motoBtn">RIDE<br>(M)</button>
  <button class="touchBtn" id="mapBtn">MAP<br>(N)</button>
</div>

<div id="dialogueOptions"></div>

<script src="js/setup.js"></script>
<script src="js/audio.js"></script>
<script src="js/config.js"></script>
<script src="js/dialogue.js"></script>
<script src="js/util.js"></script>
<script src="js/world.js"></script>
<script src="js/player.js"></script>
<script src="js/interiors.js"></script>
<script src="js/combat.js"></script>
<script src="js/update.js"></script>
<script src="js/draw-characters.js"></script>
<script src="js/draw-world.js"></script>
<script src="js/traffic.js"></script>
<script src="js/draw-scenes.js"></script>
<script src="js/visuals.js"></script>
<script src="js/main.js"></script>
</body>
</html>
